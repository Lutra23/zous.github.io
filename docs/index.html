<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="light" data-dark-theme="dark" data-light-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="分享一些学习心得，以及一些关于量子化学计算的小脚本以及一些安装教程">
    <meta property="og:title" content="邹帅的博客">
    <meta property="og:description" content="分享一些学习心得，以及一些关于量子化学计算的小脚本以及一些安装教程">
    <meta property="og:type" content="blog">
    <meta property="og:url" content="https://Lutra23.github.io/zous.github.io">
    <meta property="og:image" content="https://github.githubassets.com/favicons/favicon.svg">
    <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
    <link href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/Primer/21.0.7/primer.css" rel="stylesheet" />
    <title>邹帅的博客</title>
    <style>
        /* 全局样式 */
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 900px;
            margin: 20px auto;
            padding: 45px;
            font-size: 16px;
            font-family: sans-serif;
            line-height: 1.25;
        }

        /* Header 样式 */
        #header {
            display: flex;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--borderColor-muted, var(--color-border-muted));
            margin-bottom: 16px;
        }

        #header h1 {
            display: flex;
            align-items: center;
        }

        #header h1 a {
            color: inherit;
            text-decoration: none;
            vertical-align: bottom;
            font-size: 40px;
            font-family: Monaco;
            margin-left: 8px;
        }

        .avatar {
            transition: 0.8s;
            width: 64px;
            height: 64px;
            object-fit: cover;
        }

        .avatar:hover {
            transform: scale(1.15) rotate(360deg);
        }

        .title-right {
            display: flex;
            margin-left: auto;
        }

        .title-right .btn {
            margin-right: 8px;
            padding: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .title-right .btn:hover {
            background-color: #f0f0f0;
        }

        /* 内容导航 */
        .SideNav {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
        }

        .SideNav-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            transition: background-color 0.3s;
        }

        .SideNav-item:hover {
            background-color: #f9f9f9;
        }

        .SideNav-icon {
            margin-right: 8px;
        }

        .listTitle {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Footer 样式 */
        #footer {
            margin-top: 64px;
            text-align: center;
            font-size: small;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .avatar {
                width: 40px;
                height: 40px;
            }

            .blogTitle {
                display: none;
            }

            #buttonRSS {
                display: none;
            }

            .LabelTime {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <h1>
            <img src="https://github.githubassets.com/favicons/favicon.svg" class="avatar circle" id="avatarImg" alt="avatar">
            <a class="blogTitle">邹帅的博客</a>
        </h1>
        <div class="title-right">
            <a href="https://Lutra23.github.io/zous.github.io/tag.html" id="buttonSearch" class="btn btn-invisible circle" title="搜索">
                <svg class="octicon" width="16" height="16">
                    <path id="pathSearch" fill-rule="evenodd"></path>
                </svg>
            </a>
            <a href="https://Lutra23.github.io/zous.github.io/rss.xml" target="_blank" id="buttonRSS" class="btn btn-invisible circle" title="RSS">
                <svg class="octicon" width="16" height="16">
                    <path id="pathRSS" fill-rule="evenodd"></path>
                </svg>
            </a>
            <a class="btn btn-invisible circle" onclick="modeSwitch()" title="切换主题">
                <svg class="octicon" width="16" height="16">
                    <path id="themeSwitch" fill-rule="evenodd"></path>
                </svg>
            </a>
        </div>
    </div>

    <!-- Content -->
    <div id="content">
        <div style="margin-bottom: 16px;">分享一些学习心得，以及一些关于量子化学计算的小脚本以及一些安装教程</div>
        <nav class="SideNav">
            <a class="SideNav-item d-flex flex-items-center flex-justify-between" href="post/claude-si-wei-xie-ding.html">
                <div class="d-flex flex-items-center">
                    <svg class="SideNav-icon octicon" style="width:16px; height:16px;">
                        <path class="svgTop0"></path>
                    </svg>
                    <span class="listTitle">claude思维协定</span>
                </div>
                <div class="listLabels">
                    <span class="Label LabelName" style="background-color:#0075ca;">
                        <object><a style="color:#fff" href="tag.html#documentation">documentation</a></object>
                    </span>
                    <span class="Label LabelTime" style="background-color:#bc4c00;">2024-12-11</span>
                </div>
            </a>
            <!-- 添加更多内容项 -->
        </nav>
    </div>

    <!-- Footer -->
    <div id="footer">
        <div id="footer1">
            Copyright © <span id="copyrightYear"></span>
            <a href="https://Lutra23.github.io/zous.github.io">邹帅的博客</a>
        </div>
        <div id="footer2">
            <span id="runday"></span>
            <span>Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank">Gmeek</a></span>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        var now = new Date();
        document.getElementById("copyrightYear").innerHTML = now.getFullYear();

        // 网站运行天数计算
        if ("" != "") {
            var startSite = new Date("");
            var diff = now.getTime() - startSite.getTime();
            var diffDay = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("runday").innerHTML = "网站运行" + diffDay + "天 • ";
        }
    </script>
</body>
</html>
