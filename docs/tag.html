<!DOCTYPE html>
<html data-color-mode="light" data-dark-theme="github-light" data-light-theme="light_tritanopia" lang="zh-CN">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="content-type" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href='https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/Primer/21.0.7/primer.css' rel='stylesheet' />
    <script src='https://blog.liyifan.xyz/assets/GmeekBSZ.js'></script>
    <script src='https://blog.liyifan.xyz/assets/yifantheme.js'></script>
    <script src='https://blog.liyifan.xyz/assets/live2d.js'></script>
    <link rel="icon" href="https://img.liyifan.xyz/file/899bc692dbb6d6d7b994f.jpg">
    <meta name="description" content="lutra的博客 search page">
    <title>lutra的博客 - Tag</title>
    <style>
        /* 全局样式 */
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 900px;
            margin: 20px auto;
            padding: 45px;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background: linear-gradient(to right, #f5f7fa, #c3cfe2); /* 渐变背景 */
        }

        /* Header 样式 */
        #header {
            display: flex;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
            margin-bottom: 16px;
            align-items: center;
        }

        .tagTitle {
            margin: auto 0;
            font-size: 40px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .title-right {
            display: flex;
            margin-left: auto;
        }

        .circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #f5f7fa;
            border-radius: 50%;
            margin-right: 8px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .circle:hover {
            background-color: #e0e7ff;
        }

        /* 搜索框样式 */
        .subnav-search {
            display: flex;
            align-items: center;
            margin-right: 16px;
        }

        .subnav-search-input {
            width: 200px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            font-size: 14px;
        }

        .subnav-search button {
            padding: 8px 16px;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 0 4px 4px 0;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .subnav-search button:hover {
            background-color: #388e3c;
        }

        /* 标签样式 */
        .Label {
            display: inline-block;
            padding: 6px 12px;
            margin: 8px 4px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #0075ca;
            border-radius: 4px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .Label:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .Counter {
            margin-left: 6px;
            padding: 2px 6px;
            font-size: 12px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
        }

        /* 文章列表样式 */
        .listTitle {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
            font-weight: bold;
            color: #0075ca;
        }

        .listLabels {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
        }

        /* 底部样式 */
        #footer {
            margin-top: 64px;
            text-align: center;
            font-size: small;
            color: #666;
        }

        #footer a {
            color: #0075ca;
            text-decoration: none;
        }

        #footer a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .tagTitle {
                font-size: 28px;
            }

            .subnav-search-input {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <span class="tagTitle">加载中<span class="AnimatedEllipsis">...</span></span>
        <div class="title-right">
            <div class="subnav-search">
                <input type="search" class="subnav-search-input" placeholder="搜索标签" aria-label="搜索">
                <button onclick="searchShow()">搜索</button>
            </div>
            <a href="https://blog.liyifan.xyz" class="circle" title="首页">
                <svg class="octicon" width="16" height="16">
                    <path id="pathHome"></path>
                </svg>
            </a>
        </div>
    </div>

    <!-- 内容区 -->
    <div id="content">
        <div id="taglabel" style="margin-bottom: 8px;"></div>
        <nav class="SideNav"></nav>
        <div class="notFind" style="display:none; font-size: 24px; margin: 8px;">未找到相关内容</div>
    </div>

    <!-- Footer -->
    <div id="footer">
        <div>Copyright © <span id="copyrightYear"></span> <a href="https://blog.liyifan.xyz">LIYIFAN的备忘录</a></div>
        <div>
            <span id="runday"></span> Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank">Gmeek</a>
        </div>
    </div>

    <script>
        var now = new Date();
        document.getElementById("copyrightYear").innerHTML = now.getFullYear();

        if ("07/03/2024" != "") {
            var startSite = new Date("07/03/2024");
            var diff = now.getTime() - startSite.getTime();
            var diffDay = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("runday").innerHTML = "网站运行 " + diffDay + " 天 • ";
        }
    </script>
</body>
</html>
